name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # poppler-utils supplies pdftoppm, which run-flash-enrichment.mjs shells
      # out to for page and crop rendering. Without it the enrichment runner
      # dies before issuing a single (stubbed) API call, and the runner tests
      # fail on assertions about call counts — which reads as a logic bug
      # rather than a missing binary.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run check
